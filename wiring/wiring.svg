<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Arial, sans-serif" font-size="14">
  <rect width="700" height="380" fill="#ffffff"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold">ESP32-S3 + HC-SR04 Wiring</text>

  <!-- HC-SR04 -->
  <rect x="40" y="90" width="170" height="210" rx="10" fill="#e8f4ff" stroke="#1565c0" stroke-width="2"/>
  <text x="125" y="120" text-anchor="middle" font-weight="bold">HC-SR04</text>
  <text x="60" y="165">VCC</text>
  <text x="60" y="200">TRIG</text>
  <text x="60" y="235">ECHO</text>
  <text x="60" y="270">GND</text>

  <!-- ESP32-S3 -->
  <rect x="490" y="70" width="170" height="250" rx="10" fill="#eaf7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="575" y="100" text-anchor="middle" font-weight="bold">ESP32-S3</text>
  <text x="640" y="165" text-anchor="end">5V</text>
  <text x="640" y="200" text-anchor="end">GPIO 5</text>
  <text x="640" y="235" text-anchor="end">GPIO 6</text>
  <text x="640" y="270" text-anchor="end">GND</text>
  <text x="640" y="300" text-anchor="end" font-size="12">GPIO 2 = LED, GPIO 0 = BOOT</text>

  <!-- wires -->
  <line x1="210" y1="160" x2="490" y2="160" stroke="#d32f2f" stroke-width="3"/>
  <line x1="210" y1="195" x2="490" y2="195" stroke="#f9a825" stroke-width="3"/>
  <line x1="210" y1="265" x2="490" y2="265" stroke="#212121" stroke-width="3"/>

  <!-- ECHO via divider -->
  <line x1="210" y1="230" x2="300" y2="230" stroke="#6a1b9a" stroke-width="3"/>
  <rect x="300" y="220" width="60" height="20" fill="#fff" stroke="#6a1b9a" stroke-width="2"/>
  <text x="330" y="235" text-anchor="middle" font-size="12">1 kΩ</text>
  <line x1="360" y1="230" x2="490" y2="230" stroke="#6a1b9a" stroke-width="3"/>
  <line x1="400" y1="230" x2="400" y2="250" stroke="#6a1b9a" stroke-width="3"/>
  <rect x="390" y="250" width="20" height="40" fill="#fff" stroke="#6a1b9a" stroke-width="2"/>
  <text x="425" y="275" font-size="12">2 kΩ</text>
  <line x1="400" y1="290" x2="400" y2="265" stroke="#212121" stroke-width="0"/>
  <line x1="400" y1="290" x2="400" y2="320" stroke="#212121" stroke-width="3"/>
  <line x1="385" y1="320" x2="415" y2="320" stroke="#212121" stroke-width="3"/>
  <text x="350" y="350" text-anchor="middle" font-size="12" fill="#6a1b9a">Pembagi tegangan 5 V → 3,3 V pada ECHO</text>
</svg>
